<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="description" content="DNSGuard — DNS diagnostics and resolver reliability analysis for Google Public DNS and Cloudflare DNS.">
  <title>{{ title }}{% if page != 'home' %} · DNSGuard{% endif %}</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="preload" href="{{ url_for('static', filename='vendor/fonts/inter-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}" data-page="{{ page }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script id="app-config" type="application/json">{{ {"resolvers": resolvers, "attempts": allowed_attempts, "record_types": record_types, "timeout": {"min": timeout_min, "max": timeout_max, "default": timeout_default}}|tojson }}</script>
  <script src="{{ url_for('static', filename='vendor/lucide.min.js') }}"></script>
  {% block chart_lib %}<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
